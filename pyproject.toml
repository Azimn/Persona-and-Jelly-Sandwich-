[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-organism"
version = "0.3.0"
description = "A small deterministic engine for one persistent first-person digital organism."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
digital-organism = "digital_subject.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
